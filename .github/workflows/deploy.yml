name: Deploy WebGIS Client to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Verify PMTiles & Client Assets
        run: |
          echo "Verifying web client and spatial assets..."
          test -f client/index.html
          test -f client/app.js
          test -f client/style.css
          test -f client/data/services.geojson
          test -f client/data/hex_access_res9.geojson
          ls -la client/data

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
