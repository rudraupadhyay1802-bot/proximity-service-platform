# ============================================================
# 04_k8s_emptydir_test.yaml
# Demonstration manifest for Question 11:
# Database configured with ephemeral emptyDir instead of PVC.
# Demonstrates total data wipeout on pod recreation.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis-emptydir-flawed
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgis-emptydir-flawed
  template:
    metadata:
      labels:
        app: postgis-emptydir-flawed
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgis-secret
          volumeMounts:
            - name: ephemeral-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: ephemeral-storage
          emptyDir: {}
